[package]
name = "external-signature-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for interacting with the External Signature Program"
license = "MIT"

[dependencies]
external-signature-program = { path = "../.." }
solana-program = "2.2.1"
solana-message = "2.2.1"
solana-pubkey = "2.2.1"
solana-secp256r1-program = "2.2.1"
solana-nostd-sha256 = "0.1.3"
borsh = { version = "1.5.7", features = ["derive"] }
thiserror = "2.0.12"
bytemuck = "1.21.0"
openssl = "0.10.71"

[dev-dependencies]
base64 = "0.22.1"
bytemuck = "1.21.0"
litesvm = "0.6.1"
serde_cbor = "0.11.2"
serde_json = "1.0.140"
sha2 = "0.10.8"
solana-hash = "2.2.1"
solana-keypair = "2.2.1"
solana-message = "2.2.1"
solana-slot-hashes = "2.2.1"
solana-signer = "2.2.1"
solana-transaction = "2.2.1"

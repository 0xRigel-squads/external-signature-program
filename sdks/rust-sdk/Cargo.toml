[package]
name = "external-signature-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for interacting with the External Signature Program"
license = "MIT"

[dependencies]
external-signature-program = { path = "../.." }
solana-program = "2.2.1"
solana-pubkey = "2.2.1"
solana-nostd-sha256 = "0.1.3"
borsh = { version = "1.5.7", features = ["derive"] }
thiserror = "2.0.12"
sha2 = "0.10.8"

[dev-dependencies]
solana-keypair = "2.2.1"
solana-signer = "2.2.1"
